name = cogwork
title = Cogwork
description = Block-programmable robots with functions and packages. Works in Minetest Game, Mineclonia, VoxeLibre, Hades Revisited and Skyblock: Zero.
# The oldest Luanti the mod runs on (formspec version 6, entity selection boxes that
# turn with the entity, the `core` namespace)
min_minetest_version = 5.9.0

# Games the recipes, item aliases, buckets and sounds are made for (Luanti itself
# ignores this line; it is here for people and ContentDB).
supported_games = minetest_game, mineclonia, mineclone2, hades_revisited, skyblock_zero
optional_depends = emc, default, bucket, farming, mcl_core, mcl_sounds, mcl_buckets, mcl_farming, hades_core, hades_sounds, hades_farming, sbz_resources, sbz_audio, sbz_power, sbz_chem, technic, techage
